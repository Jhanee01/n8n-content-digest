services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    # Lets the container reach the Whisper service on the host machine
    # (built in on Docker Desktop, needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GENERIC_TIMEZONE=Europe/Budapest
      - TZ=Europe/Budapest
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
